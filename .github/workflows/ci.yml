name: EDG companion CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: edg-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contributor-contract:
    uses: Space-FALCON-Lab/SpaceAGORA.jl/.github/workflows/contributor-ci.yml@0487e8226107592b19221618f0f21f500cf2aacf
    with:
      spaceagora-rev: 0487e8226107592b19221618f0f21f500cf2aacf
      kind: companion
      julia-version: "1.12"
      manifest: core
      depwarn: error
      threads: "2"
      load-orders: true
  installation-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      JULIA_LOAD_PATH: "@:@stdlib"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Installer preflight safeguards
        run: julia --startup-file=no test/installation_tests.jl
      - name: Independent installation of the published pair
        run: julia --startup-file=no scripts/setup_env.jl "$RUNNER_TEMP/edg-environment"
      # This required job also qualifies the installer's fresh dependency resolution.
      # The shared job independently checks the environment seeded from core's manifest.
      - name: Full suite in the independently installed environment
        run: julia --startup-file=no --check-bounds=yes --project="$RUNNER_TEMP/edg-environment" -e 'using Pkg; Pkg.test("SpaceAGORAEDG")'
      - name: Reject an incompatible core before numerical loading
        run: julia --startup-file=no --project="$RUNNER_TEMP/edg-environment" test/incompatible_core.jl
      - name: Core-first installed pair smoke
        run: julia --startup-file=no --project="$RUNNER_TEMP/edg-environment" test/load_order.jl core-first
      - name: Companion-first installed pair smoke
        run: julia --startup-file=no --project="$RUNNER_TEMP/edg-environment" test/load_order.jl edg-first
      - name: Installation leaves the companion unchanged
        run: git diff --exit-code
  core-release-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - name: The core pin is a SpaceAGORA release
        run: julia --startup-file=no test/core_release_pin.jl
