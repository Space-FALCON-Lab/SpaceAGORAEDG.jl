name: EDG companion CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: edg-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  installation-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "1"
      JULIA_LOAD_PATH: "@:@stdlib"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: julia-actions/cache@v2
      - name: Installer preflight safeguards
        run: julia --startup-file=no test/installation_tests.jl
      - name: Independent installation of the published pair
        run: julia --startup-file=no scripts/setup_env.jl "$RUNNER_TEMP/edg-environment"
      - name: Companion tests
        run: julia --startup-file=no --project="$RUNNER_TEMP/edg-environment" -e 'using Pkg; Pkg.test("SpaceAGORAEDG")'
      - name: Both package load orders, and the refusal without the package
        run: |
          julia --startup-file=no --project="$RUNNER_TEMP/edg-environment" test/load_order.jl core-first
          julia --startup-file=no --project="$RUNNER_TEMP/edg-environment" test/load_order.jl edg-first
      - name: Installation leaves the companion unchanged
        run: git diff --exit-code
  core-release-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - name: The core pin is a SpaceAGORA release
        run: julia --startup-file=no test/core_release_pin.jl
